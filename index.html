
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dúo Itaú - Sala de Ensayos</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 35px 15px;
  background: #1f2937;
}

h1 {
  color: #facc15;
  margin-bottom: 5px;
}

header p {
  color: #d1d5db;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

.cancion {
  background: #1f2937;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 15px;
}

.cancion h2 {
  color: #facc15;
  font-size: 20px;
}

audio {
  width: 100%;
  margin-top: 10px;
}

.estado {
  color: #9ca3af;
  font-size: 14px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #9ca3af;
}
</style>
</head>

<body>

<header>
<h1>DÚO ITAÚ</h1>
<h2>SALA DE ENSAYOS VIRTUAL</h2>
<p>Presentación del disco LUNA NUEVA</p>
<p>Material de estudio para los músicos</p>
</header>

<main id="canciones"></main>

<footer>
Dúo Itaú - Luna Nueva 2026
</footer>

<script>

// LISTA DE CANCIONES Y ARCHIVOS DE AUDIO

const canciones = [
  {
    titulo: "Luna Nueva",
    archivo: "01 LUNA NUEVA pa german.mp3"
  },
  {
    titulo: "Dueña del tiempo",
    archivo: "02.mp3"
  },
  {
    titulo: "Grieta",
    archivo: "03.mp3"
  },
  {
    titulo: "El simple valor",
    archivo: "04.mp3"
  },
  {
    titulo: "Mejor conmigo",
    archivo: "05.mp3"
  },
  {
    titulo: "Milagro",
    archivo: "06.mp3"
  },
  {
    titulo: "Pasajera de la soledad",
    archivo: "07.mp3"
  },
  {
    titulo: "Indiferencia plena",
    archivo: "08.mp3"
  },
  {
    titulo: "Tierra",
    archivo: "09.mp3"
  },
  {
    titulo: "Copla ancestral",
    archivo: "10.mp3"
  }
];

// CREAR REPRODUCTORES

const contenedor = document.getElementById("canciones");

canciones.forEach((cancion, indice) => {

  const numero = String(indice + 1).padStart(2, "0");

  const seccion = document.createElement("section");
  seccion.className = "cancion";

  const nombre = document.createElement("h2");
  nombre.textContent = numero + " - " + cancion.titulo;

  const descripcion = document.createElement("p");
  descripcion.textContent = "Pista completa de ensayo";

  const reproductor = document.createElement("audio");
  reproductor.controls = true;
  reproductor.preload = "metadata";

  reproductor.src =
    "audios/" + encodeURIComponent(cancion.archivo);

  const aviso = document.createElement("p");
  aviso.className = "estado";

  aviso.textContent =
    indice === 0
    ? "Cargando pista de ensayo..."
    : "Audio pendiente de cargar.";

  reproductor.addEventListener("canplay", () => {
    aviso.textContent = "Audio disponible para escuchar.";
  });

  reproductor.addEventListener("error", () => {
    aviso.textContent =
      "Audio no disponible. Verificá que el archivo esté cargado.";
  });

  seccion.append(
    nombre,
    descripcion,
    reproductor,
    aviso
  );

  contenedor.appendChild(seccion);

});

</script>

</body>
</html>
