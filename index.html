
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dúo Itaú - Sala de ensayos</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background-color: #111827;
  background-image:
    linear-gradient(
      rgba(17, 24, 39, 0.65),
      rgba(17, 24, 39, 0.65)
    ),
    url("https://s.mxmcdn.net/images-storage/albums5/7/6/7/9/9/7/110799767_500_500.jpg");
  background-position: center top;
  background-size: auto 450px;
  background-attachment: fixed;
  background-repeat: no-repeat;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 35px 15px;
  background: rgba(31, 41, 55, 0.85);
}

h1 {
  color: #facc15;
  margin-bottom: 5px;
}

header p {
  color: #d1d5db;
}

.aliento {
  display: inline-block;
  margin: 15px auto 0;
  padding: 12px 24px;
  background: #facc15;
  color: #111827;
  border: 3px solid white;
  border-radius: 14px;
  font-size: clamp(20px, 5vw, 34px);
  font-weight: 900;
  letter-spacing: 1px;
  text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.5);
  box-shadow: 0 5px 18px rgba(0, 0, 0, 0.4);
  transform: rotate(-2deg);
}

header p.aliento {
  color: #111827;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

.oculto {
  display: none !important;
}

/* PANTALLA DE INGRESO */

.ingreso {
  max-width: 440px;
  margin: 35px auto;
  padding: 30px 22px;
  text-align: center;
  background: rgba(31, 41, 55, 0.95);
  border: 1px solid #4b5563;
  border-radius: 16px;
}

.ingreso h2 {
  color: #facc15;
}

.ingreso input {
  width: 100%;
  padding: 14px;
  margin: 15px 0;
  border: 2px solid #6b7280;
  border-radius: 9px;
  font-size: 18px;
  text-align: center;
}

button {
  padding: 12px 22px;
  background: #facc15;
  color: #111827;
  border: none;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #fde047;
}

.error {
  color: #fca5a5;
  font-weight: bold;
}

/* ENCABEZADO DEL PANEL */

.panel-encabezado {
  text-align: center;
  padding: 22px;
  margin-bottom: 20px;
  background: rgba(31, 41, 55, 0.92);
  border-radius: 14px;
}

.instrumento {
  font-size: 54px;
  margin: 8px 0;
}

.panel-encabezado h2 {
  color: #facc15;
  margin: 8px 0;
}

.salir {
  margin-top: 12px;
  background: #374151;
  color: white;
  border: 1px solid #6b7280;
}

/* CANCIONES */

.cancion {
  background: rgba(31, 41, 55, 0.88);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 15px;
}

.cancion h2 {
  color: #facc15;
  font-size: 20px;
}

audio {
  width: 100%;
  margin-top: 10px;
}

.estado {
  color: #d1d5db;
  font-size: 14px;
}

.sin-metronomo {
  display: inline-block;
  margin: 15px 0 5px;
  padding: 9px 15px;
  background: #facc15;
  color: #111827;
  border-radius: 8px;
  font-weight: bold;
  font-size: 15px;
}

/* FADERS */

.mezclador {
  display: flex;
  justify-content: space-around;
  gap: 15px;
  margin-top: 20px;
}

.canal {
  flex: 1;
  max-width: 180px;
  background: rgba(17, 24, 39, 0.9);
  border: 1px solid #374151;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
}

.canal h3 {
  color: #facc15;
  margin: 0 0 15px;
  font-size: 16px;
}

.fader {
  writing-mode: vertical-lr;
  direction: rtl;
  width: 35px;
  height: 140px;
  cursor: pointer;
  accent-color: #facc15;
}

.valor {
  color: white;
  margin-top: 12px;
  font-size: 18px;
  font-weight: bold;
}

.etiqueta {
  color: #9ca3af;
  font-size: 12px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #d1d5db;
  background: rgba(17, 24, 39, 0.7);
}
</style>
</head>

<body>

<header>
  <h1>DÚO ITAÚ</h1>
  <h2>SALA DE ENSAYOS</h2>
  <p>Presentación del disco LUNA NUEVA</p>
  <p class="aliento">¡VAMOOOO PAPIRRIIII! 🎸🔥</p>
</header>

<main>

  <!-- PANTALLA DE INGRESO -->

  <section id="pantallaIngreso" class="ingreso">

    <h2>🎵 INGRESO DE MÚSICOS</h2>

    <p>Escribí tu clave para entrar a tu panel de ensayo.</p>

    <form id="formularioIngreso">

      <input
        id="campoClave"
        type="password"
        placeholder="Tu clave"
        autocomplete="off"
        required
      >

      <button type="submit">ENTRAR</button>

    </form>

    <p id="mensajeError" class="error" role="alert"></p>

  </section>

  <!-- PANEL DEL MÚSICO -->

  <div id="panelMusico" class="oculto">

    <section class="panel-encabezado">

      <div id="iconoInstrumento" class="instrumento"></div>

      <h2 id="nombreMusico"></h2>

      <p id="nombreInstrumento"></p>

      <button id="botonSalir" class="salir">
        Salir de mi panel
      </button>

    </section>

    <div id="canciones"></div>

  </div>

</main>

<footer>
  Dúo Itaú - Luna Nueva 2026
</footer>

<script>

// =====================================================
// FONDO PRINCIPAL: TAPA DEL DISCO DESDE INTERNET
// =====================================================

const fondoPrincipal =
  "https://s.mxmcdn.net/images-storage/albums5/7/6/7/9/9/7/110799767_500_500.jpg";


// =====================================================
// MÚSICOS, CLAVES Y FONDOS
// =====================================================
//
// Emiliano tiene su imagen personalizada.
// Los demás usan la tapa del disco hasta que
// se agreguen sus propias imágenes.
//

const musicos = {

  german: {
    nombre: "Germán",
    clave: "claudiogeno",
    instrumento: "Panel de pistas",
    icono: "🎸",
    carpeta: "audios",
    fondo: fondoPrincipal
  },

  emiliano: {
    nombre: "Emiliano",
    clave: "flute",
    instrumento: "Flauta y quena",
    icono: "🪈",
    carpeta: "audios/emiliano",
    fondo: "emiliano.png"
  },

  marcos: {
    nombre: "Marcos",
    clave: "tango",
    instrumento: "Bandoneón",
    icono: "🪗",
    carpeta: "audios/marcos",
    fondo: fondoPrincipal
  },

  flor: {
    nombre: "Flor",
    clave: "magico",
    instrumento: "Piano",
    icono: "🎹",
    carpeta: "audios/flor",
    fondo: fondoPrincipal
  },

  hernan: {
    nombre: "Hernán",
    clave: "vc",
    instrumento: "Guitarra",
    icono: "🎸",
    carpeta: "audios/hernan",
    fondo: fondoPrincipal
  },

  marculi: {
    nombre: "Marculi",
    clave: "bajeo",
    instrumento: "Bajo",
    icono: "🎸",
    carpeta: "audios/marculi",
    fondo: fondoPrincipal
  },

  diego: {
    nombre: "Diego",
    clave: "cerati",
    instrumento: "Guitarra eléctrica",
    icono: "🎸",
    carpeta: "audios/diego",
    fondo: fondoPrincipal
  }

};


// =====================================================
// CAMBIAR LA IMAGEN DE FONDO
// =====================================================

function cambiarFondo(imagen) {

  document.body.style.backgroundImage =
    'linear-gradient(' +
      'rgba(17, 24, 39, 0.65),' +
      'rgba(17, 24, 39, 0.65)' +
    '), url("' + imagen + '")';

}


// =====================================================
// CANCIONES EN EL ORDEN DEL SHOW
// =====================================================

const canciones = [

  {
    titulo: "Mariel (solista)",
    archivoGerman: "",
    participaGerman: false
  },

  {
    titulo: "Claudio (solista)",
    archivoGerman: "",
    participaGerman: false
  },

  {
    titulo: "El cosechero",
    archivoGerman: "",
    participaGerman: false
  },

  {
    titulo: "Salamanqueando pa' mí",
    archivoGerman: "",
    participaGerman: false
  },

  {
    titulo: "Luna Nueva",
    archivoGerman: "01 LUNA NUEVA pa german.mp3",
    participaGerman: true
  },

  {
    titulo: "Grieta",
    archivoGerman: "04 GRIETA CLOCK pa german.mp3",
    participaGerman: true
  },

  {
    titulo: "Mejor conmigo",
    archivoGerman: "mejor conmigo pista clock pa german.mp3",
    participaGerman: true
  },

  {
    titulo: "El simple valor",
    archivoGerman: "el simple valor pista clock pa german.mp3",
    participaGerman: true
  },

  {
    titulo: "Indiferencia plena",
    archivoGerman: "indiferencia plena pa german.mp3",
    participaGerman: true
  },

  {
    titulo: "Pasajera",
    archivoGerman: "06 PASAJERA pa german.mp3",
    participaGerman: true
  },

  {
    titulo: "Tierra",
    archivoGerman: "tierra pa german.mp3",
    participaGerman: true
  },

  {
    titulo: "Copla ancestral",
    archivoGerman: "",
    participaGerman: true
  },

  {
    titulo: "Milagro",
    archivoGerman: "",
    participaGerman: true
  },

  {
    titulo: "Dueña del tiempo",
    archivoGerman: "10 dueña del tiempo pa german.mp3",
    participaGerman: true
  },

  {
    titulo: "Luz",
    archivoGerman: "luz.mp3",
    participaGerman: true,
    sinMetronomo: true
  },

  {
    titulo: "Ya sé (cierre)",
    archivoGerman: "YA SE.mp3",
    participaGerman: true,
    sinMetronomo: true
  },

  {
    titulo: "A pura ushuta",
    archivoGerman: "Dúo Itaú - A pura Ushuta (chacarera).mp3",
    participaGerman: true,
    sinMetronomo: true
  }

];


// =====================================================
// ARCHIVOS PROPIOS DE CADA MÚSICO
// =====================================================

const archivosPorMusico = {

  emiliano: {
    "Mejor conmigo": "mejor conmigo pa emi.mp3",
    "Grieta": "04 GRIETA emi.mp3",
    "Tierra": "tierra pa emi.mp3",
    "Luz": "luz.mp3",

    // Comparte el mismo MP3 que Germán:
    "A pura ushuta":
      "audios/Dúo Itaú - A pura Ushuta (chacarera).mp3"
  },

  marcos: {},

  flor: {},

  hernan: {},

  marculi: {},

  diego: {}

};


// =====================================================
// PARTICIPACIÓN DE CADA MÚSICO
// =====================================================

const participacionPorMusico = {

  emiliano: [
    "Mejor conmigo",
    "Grieta",
    "Tierra",
    "Luz",
    "A pura ushuta"
  ],

  marcos: [
    "Indiferencia plena",
    "El simple valor",
    "A pura ushuta"
  ],

  flor: [
    "Pasajera",
    "Mejor conmigo",
    "Milagro",
    "Dueña del tiempo",
    "El simple valor",
    "Ya sé (cierre)",
    "A pura ushuta"
  ],

  hernan: [
    "Mejor conmigo",
    "El simple valor",
    "Indiferencia plena",
    "Tierra",
    "A pura ushuta"
  ],

  diego: [
    "Copla ancestral",
    "Ya sé (cierre)",
    "A pura ushuta"
  ],

  marculi: canciones
    .slice(2)
    .map(cancion => cancion.titulo)

};


// =====================================================
// MOTOR DE AUDIO
// =====================================================

const AudioContextClass =
  window.AudioContext || window.webkitAudioContext;

let contextoAudio = null;

function obtenerContexto() {

  if (!contextoAudio) {
    contextoAudio = new AudioContextClass();
  }

  return contextoAudio;

}


// =====================================================
// ELEMENTOS DE LA PÁGINA
// =====================================================

const pantallaIngreso =
  document.getElementById("pantallaIngreso");

const formularioIngreso =
  document.getElementById("formularioIngreso");

const campoClave =
  document.getElementById("campoClave");

const mensajeError =
  document.getElementById("mensajeError");

const panelMusico =
  document.getElementById("panelMusico");

const contenedor =
  document.getElementById("canciones");

const nombreMusico =
  document.getElementById("nombreMusico");

const nombreInstrumento =
  document.getElementById("nombreInstrumento");

const iconoInstrumento =
  document.getElementById("iconoInstrumento");

const botonSalir =
  document.getElementById("botonSalir");


// =====================================================
// INGRESO CON CLAVE
// =====================================================

formularioIngreso.addEventListener(
  "submit",
  (evento) => {

    evento.preventDefault();

    const claveIngresada =
      campoClave.value.trim();

    const idMusico = Object.keys(musicos).find(
      id => musicos[id].clave === claveIngresada
    );

    if (!idMusico) {

      mensajeError.textContent =
        "Clave incorrecta. Intentá nuevamente.";

      campoClave.value = "";
      campoClave.focus();

      return;

    }

    mensajeError.textContent = "";

    campoClave.value = "";

    abrirPanel(idMusico);

  }
);


// =====================================================
// ABRIR PANEL DEL MÚSICO
// =====================================================

function abrirPanel(idMusico) {

  const musico = musicos[idMusico];

  cambiarFondo(musico.fondo);

  detenerAudios();

  contenedor.replaceChildren();

  nombreMusico.textContent =
    "PISTAS PARA " + musico.nombre.toUpperCase();

  nombreInstrumento.textContent =
    musico.instrumento;

  iconoInstrumento.textContent =
    musico.icono;

  pantallaIngreso.classList.add("oculto");

  panelMusico.classList.remove("oculto");

  canciones.forEach((cancion, indice) => {

    crearCancion(
      cancion,
      indice,
      idMusico,
      musico
    );

  });

  window.scrollTo(0, 0);

}


// =====================================================
// DETENER AUDIOS AL CAMBIAR DE PANEL
// =====================================================

function detenerAudios() {

  const reproductores =
    contenedor.querySelectorAll("audio");

  reproductores.forEach(reproductor => {

    reproductor.pause();

    reproductor.removeAttribute("src");

    reproductor.load();

  });

}


// =====================================================
// SALIR DEL PANEL
// =====================================================

botonSalir.addEventListener(
  "click",
  () => {

    detenerAudios();

    contenedor.replaceChildren();

    panelMusico.classList.add("oculto");

    pantallaIngreso.classList.remove("oculto");

    // VOLVER A LA TAPA DE LUNA NUEVA

    cambiarFondo(fondoPrincipal);

    mensajeError.textContent = "";

    campoClave.value = "";

    campoClave.focus();

    window.scrollTo(0, 0);

  }
);


// =====================================================
// CREAR CADA CANCIÓN
// =====================================================

function crearCancion(
  cancion,
  indice,
  idMusico,
  musico
) {

  const numero =
    String(indice + 1).padStart(2, "0");

  const seccion =
    document.createElement("section");

  seccion.className = "cancion";

  const nombre =
    document.createElement("h2");

  nombre.textContent =
    numero + " - " + cancion.titulo;

  seccion.appendChild(nombre);

  // DETERMINAR SI PARTICIPA

  let participa = false;

  if (idMusico === "german") {

    participa = cancion.participaGerman;

  } else {

    participa =
      participacionPorMusico[idMusico]
        .includes(cancion.titulo);

  }

  if (!participa) {

    const aviso =
      document.createElement("p");

    aviso.className = "estado";

    aviso.textContent =
      musico.nombre + " no participa en este tema.";

    seccion.appendChild(aviso);

    contenedor.appendChild(seccion);

    return;

  }

  // BUSCAR EL ARCHIVO CORRESPONDIENTE

  let archivo = "";

  if (idMusico === "german") {

    archivo = cancion.archivoGerman;

  } else {

    archivo =
      archivosPorMusico[idMusico][cancion.titulo] || "";

  }

  // SI TODAVÍA NO TIENE AUDIO

  if (!archivo) {

    const aviso =
      document.createElement("p");

    aviso.className = "estado";

    aviso.textContent =
      "Audio pendiente de cargar.";

    seccion.appendChild(aviso);

    contenedor.appendChild(seccion);

    return;

  }

  // CREAR REPRODUCTOR

  const descripcion =
    document.createElement("p");

  descripcion.textContent =
    "Pista completa de ensayo";

  const reproductor =
    document.createElement("audio");

  reproductor.controls = true;

  reproductor.preload = "metadata";

  // USAR RUTA COMPARTIDA SI YA COMIENZA CON audios/

  if (archivo.startsWith("audios/")) {

    reproductor.src =
      archivo
        .split("/")
        .map(parte => encodeURIComponent(parte))
        .join("/");

  } else {

    reproductor.src =
      musico.carpeta + "/" +
      encodeURIComponent(archivo);

  }

  const aviso =
    document.createElement("p");

  aviso.className = "estado";

  aviso.textContent = "Pista de ensayo";

  reproductor.addEventListener(
    "canplay",
    () => {

      aviso.textContent =
        "Audio disponible para escuchar.";

    }
  );

  reproductor.addEventListener(
    "error",
    () => {

      aviso.textContent =
        "Audio no disponible. Verificá el archivo.";

    }
  );

  seccion.append(
    descripcion,
    reproductor
  );

  // LUZ, YA SÉ Y A PURA USHUTA:
  // REPRODUCTOR NORMAL, SIN FADERS

  if (cancion.sinMetronomo) {

    const cartel =
      document.createElement("p");

    cartel.className = "sin-metronomo";

    cartel.textContent =
      "Estas van sin metrónomo";

    seccion.appendChild(cartel);

  } else {

    crearMezclador(
      reproductor,
      seccion
    );

  }

  seccion.appendChild(aviso);

  contenedor.appendChild(seccion);

}


// =====================================================
// MEZCLADOR ESTÉREO
// =====================================================

function crearMezclador(
  reproductor,
  seccion
) {

  const contexto = obtenerContexto();

  const fuente =
    contexto.createMediaElementSource(
      reproductor
    );

  const divisor =
    contexto.createChannelSplitter(2);

  const gananciaL =
    contexto.createGain();

  const gananciaR =
    contexto.createGain();

  const mezclador =
    contexto.createChannelMerger(2);

  gananciaL.gain.value = 2;

  gananciaR.gain.value = 2;

  fuente.connect(divisor);

  divisor.connect(
    gananciaL, 0
  );

  divisor.connect(
    gananciaR, 1
  );

  gananciaL.connect(
    mezclador, 0, 0
  );

  gananciaR.connect(
    mezclador, 0, 1
  );

  mezclador.connect(
    contexto.destination
  );

  reproductor.addEventListener(
    "play",
    async () => {

      if (contexto.state === "suspended") {

        try {

          await contexto.resume();

        } catch (error) {

          console.error(error);

        }

      }

    }
  );

  const panel =
    document.createElement("div");

  panel.className = "mezclador";

  function crearFader(
    titulo,
    etiqueta,
    ganancia
  ) {

    const canal =
      document.createElement("div");

    canal.className = "canal";

    const encabezado =
      document.createElement("h3");

    encabezado.textContent = titulo;

    const deslizador =
      document.createElement("input");

    deslizador.type = "range";

    deslizador.className = "fader";

    deslizador.min = "0";

    deslizador.max = "100";

    deslizador.value = "100";

    deslizador.setAttribute(
      "aria-label",
      "Volumen canal " + etiqueta
    );

    const valor =
      document.createElement("div");

    valor.className = "valor";

    valor.textContent = "100%";

    const texto =
      document.createElement("div");

    texto.className = "etiqueta";

    texto.textContent = etiqueta;

    deslizador.addEventListener(
      "input",
      () => {

        const volumen =
          Number(deslizador.value) / 100 * 2;

        ganancia.gain.value = volumen;

        valor.textContent =
          deslizador.value + "%";

      }
    );

    canal.append(
      encabezado,
      deslizador,
      valor,
      texto
    );

    return canal;

  }

  const faderL = crearFader(
    "CANAL L",
    "IZQUIERDO",
    gananciaL
  );

  const faderR = crearFader(
    "CANAL R",
    "DERECHO",
    gananciaR
  );

  panel.append(
    faderL,
    faderR
  );

  seccion.appendChild(panel);

}

</script>

</body>
</html>
