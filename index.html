<html lang="es">

<meta charset="UTF-8">

<title>Dúo Itaú - Sala de ensayos</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background-color: #111827;
  background-image:
    linear-gradient(rgba(17,24,39,.65), rgba(17,24,39,.65)),
    url("https://s.mxmcdn.net/images-storage/albums5/7/6/7/9/9/7/110799767_500_500.jpg");
  background-position: center top;
  background-size: auto 450px;
  background-attachment: fixed;
  background-repeat: no-repeat;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 35px 15px;
  background: rgba(31,41,55,.85);
}

h1 {
  color: #facc15;
  margin-bottom: 5px;
}

header p {
  color: #d1d5db;
}

.aliento {
  display: inline-block;
  margin: 15px auto 0;
  padding: 12px 24px;
  background: #facc15;
  color: #111827;
  border: 3px solid white;
  border-radius: 14px;
  font-size: clamp(20px,5vw,34px);
  font-weight: 900;
  letter-spacing: 1px;
  box-shadow: 0 5px 18px rgba(0,0,0,.4);
  transform: rotate(-2deg);
}

header p.aliento {
  color: #111827;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

.oculto {
  display: none !important;
}

/* INGRESO */

.ingreso {
  max-width: 440px;
  margin: 35px auto;
  padding: 30px 22px;
  text-align: center;
  background: rgba(31,41,55,.95);
  border: 1px solid #4b5563;
  border-radius: 16px;
}

.ingreso h2 {
  color: #facc15;
}

.ingreso input {
  width: 100%;
  padding: 14px;
  margin: 15px 0;
  border: 2px solid #6b7280;
  border-radius: 9px;
  font-size: 18px;
  text-align: center;
}

button {
  padding: 12px 22px;
  background: #facc15;
  color: #111827;
  border: none;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #fde047;
}

.error {
  color: #fca5a5;
  font-weight: bold;
}

/* PANEL */

.panel-encabezado {
  text-align: center;
  padding: 22px;
  margin-bottom: 20px;
  background: rgba(31,41,55,.92);
  border-radius: 14px;
}

.instrumento {
  font-size: 54px;
  margin: 8px 0;
}

.panel-encabezado h2 {
  color: #facc15;
  margin: 8px 0;
}

.salir {
  margin-top: 12px;
  background: #374151;
  color: white;
  border: 1px solid #6b7280;
}

/* CANCIONES */

.cancion {
  background: rgba(31,41,55,.88);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 15px;
}

.cancion h2 {
  color: #facc15;
  font-size: 20px;
}

audio {
  width: 100%;
  margin-top: 10px;
}

.estado {
  color: #d1d5db;
  font-size: 14px;
}

.sin-metronomo {
  display: inline-block;
  margin: 15px 0 5px;
  padding: 9px 15px;
  background: #facc15;
  color: #111827;
  border-radius: 8px;
  font-weight: bold;
  font-size: 15px;
}

/* VIDEOS */

.video-ensayo {
  margin-top: 22px;
  padding-top: 15px;
  border-top: 1px solid #4b5563;
}

.video-ensayo h3 {
  color: #facc15;
  font-size: 17px;
  margin: 0 0 12px;
}

.video-contenedor {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 10px;
  background: #000;
}

.video-contenedor iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

/* PARTITURAS */

.partitura-ensayo {
  margin-top: 22px;
  padding-top: 15px;
  border-top: 1px solid #4b5563;
}

.partitura-ensayo h3 {
  color: #facc15;
  font-size: 18px;
}

.partitura-ensayo iframe {
  display: block;
  width: 100%;
  height: 700px;
  border: 0;
  border-radius: 10px;
  background: white;
}

.partitura-ensayo a {
  display: inline-block;
  margin-top: 12px;
  padding: 11px 16px;
  background: #facc15;
  color: #111827;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}

/* FADERS */

.mezclador {
  display: flex;
  justify-content: space-around;
  gap: 15px;
  margin-top: 20px;
}

.canal {
  flex: 1;
  max-width: 180px;
  background: rgba(17,24,39,.9);
  border: 1px solid #374151;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
}

.canal h3 {
  color: #facc15;
  margin: 0 0 15px;
  font-size: 16px;
}

.fader {
  writing-mode: vertical-lr;
  direction: rtl;
  width: 35px;
  height: 140px;
  cursor: pointer;
  accent-color: #facc15;
}

.valor {
  color: white;
  margin-top: 12px;
  font-size: 18px;
  font-weight: bold;
}

.etiqueta {
  color: #9ca3af;
  font-size: 12px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #d1d5db;
  background: rgba(17,24,39,.7);
}

@media (max-width: 600px) {
  main {
    padding: 12px;
  }

  .cancion {
    padding: 15px;
  }

  .partitura-ensayo iframe {
    height: 520px;
  }
}
</style>
</head>

<header>
  <h1>DÚO ITAÚ</h1>
  <h2>SALA DE ENSAYOS</h2>
  <p>Presentación del disco LUNA NUEVA</p>

  <p id="mensajeAliento" class="aliento">
    ¡VAMOOOO PAPIRRIIII! 🎸🔥
  </p>
</header>

<main>

  <section id="pantallaIngreso" class="ingreso">

    <h2>🎵 INGRESO DE MÚSICOS</h2>

    <p>
      Escribí tu clave para entrar a tu panel de ensayo.
    </p>

    <form id="formularioIngreso">

      <input
        id="campoClave"
        type="password"
        placeholder="Tu clave"
        autocomplete="off"
        required
      >

      <button type="submit">
        ENTRAR
      </button>

    </form>

    <p id="mensajeError" class="error"></p>

  </section>

  <div id="panelMusico" class="oculto">

    <section class="panel-encabezado">

      <div
        id="iconoInstrumento"
        class="instrumento">
      </div>

      <h2 id="nombreMusico"></h2>

      <p id="nombreInstrumento"></p>

      <button id="botonSalir" class="salir">
        Salir de mi panel
      </button>

    </section>

    <div id="canciones"></div>

  </div>

</main>

<footer>
