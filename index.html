
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dúo Itaú - Pistas para Germán</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background-color: #111827;
  background-image:
    linear-gradient(
      rgba(17, 24, 39, 0.65),
      rgba(17, 24, 39, 0.65)
    ),
    url("image.png");
  background-position: center;
  background-size: cover;
  background-attachment: fixed;
  background-repeat: no-repeat;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 35px 15px;
  background: rgba(31, 41, 55, 0.85);
}

h1 {
  color: #facc15;
  margin-bottom: 5px;
}

header p {
  color: #d1d5db;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

.cancion {
  background: rgba(31, 41, 55, 0.88);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 15px;
}

.cancion h2 {
  color: #facc15;
  font-size: 20px;
}

audio {
  width: 100%;
  margin-top: 10px;
}

.estado {
  color: #d1d5db;
  font-size: 14px;
}

.mezclador {
  display: flex;
  justify-content: space-around;
  gap: 15px;
  margin-top: 20px;
}

.canal {
  flex: 1;
  max-width: 180px;
  background: rgba(17, 24, 39, 0.9);
  border: 1px solid #374151;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
}

.canal h3 {
  color: #facc15;
  margin: 0 0 15px;
  font-size: 16px;
}

.fader {
  writing-mode: vertical-lr;
  direction: rtl;
  width: 35px;
  height: 140px;
  cursor: pointer;
  accent-color: #facc15;
}

.valor {
  color: white;
  margin-top: 12px;
  font-size: 18px;
  font-weight: bold;
}

.etiqueta {
  color: #9ca3af;
  font-size: 12px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #d1d5db;
  background: rgba(17, 24, 39, 0.7);
}
</style>
</head>

<body>

<header>
  <h1>DÚO ITAÚ</h1>
  <h2>PISTAS PARA GERMÁN</h2>
  <p>Presentación del disco LUNA NUEVA</p>
  <p>Material de estudio para los músicos</p>
</header>

<main id="canciones"></main>

<footer>
  Dúo Itaú - Luna Nueva 2026
</footer>

<script>

// LISTA DE CANCIONES Y ARCHIVOS

const canciones = [
  {
    titulo: "Luna Nueva",
    archivo: "01 LUNA NUEVA pa german.mp3"
  },
  {
    titulo: "Dueña del tiempo",
    archivo: "10 dueña del tiempo pa german.mp3"
  },
  {
    titulo: "Grieta",
    archivo: "04 GRIETA CLOCK pa german.mp3"
  },
  {
    titulo: "El simple valor",
    archivo: "el simple valor pista clock pa german.mp3"
  },
  {
    titulo: "Mejor conmigo",
    archivo: "mejor conmigo pista clock pa german.mp3"
  },
  {
    titulo: "Milagro",
    archivo: ""
  },
  {
    titulo: "Pasajera de la soledad",
    archivo: ""
  },
  {
    titulo: "Indiferencia plena",
    archivo: ""
  },
  {
    titulo: "Tierra",
    archivo: ""
  },
  {
    titulo: "Copla ancestral",
    archivo: ""
  }
];

// MOTOR DE AUDIO

const AudioContextClass =
  window.AudioContext || window.webkitAudioContext;

let contextoAudio = null;

function obtenerContexto() {
  if (!contextoAudio) {
    contextoAudio = new AudioContextClass();
  }
  return contextoAudio;
}

// CREAR REPRODUCTORES

const contenedor =
  document.getElementById("canciones");

canciones.forEach((cancion, indice) => {

  const numero =
    String(indice + 1).padStart(2, "0");

  const seccion =
    document.createElement("section");

  seccion.className = "cancion";

  const nombre =
    document.createElement("h2");

  nombre.textContent =
    numero + " - " + cancion.titulo;

  const descripcion =
    document.createElement("p");

  descripcion.textContent =
    "Pista completa de ensayo";

  seccion.append(nombre, descripcion);

  if (cancion.archivo) {

    // REPRODUCTOR

    const reproductor =
      document.createElement("audio");

    reproductor.controls = true;
    reproductor.preload = "metadata";

    reproductor.src =
      "audios/" +
      encodeURIComponent(cancion.archivo);

    // MEZCLADOR ESTEREO

    const contexto = obtenerContexto();

    const fuente =
      contexto.createMediaElementSource(
        reproductor
      );

    const divisor =
      contexto.createChannelSplitter(2);

    const gananciaL =
      contexto.createGain();

    const gananciaR =
      contexto.createGain();

    const mezclador =
      contexto.createChannelMerger(2);

    // GANANCIA INICIAL AUMENTADA

    gananciaL.gain.value = 2;
    gananciaR.gain.value = 2;

    // CANAL IZQUIERDO A SALIDA IZQUIERDA
    // CANAL DERECHO A SALIDA DERECHA

    fuente.connect(divisor);

    divisor.connect(
      gananciaL, 0
    );

    divisor.connect(
      gananciaR, 1
    );

    gananciaL.connect(
      mezclador, 0, 0
    );

    gananciaR.connect(
      mezclador, 0, 1
    );

    mezclador.connect(
      contexto.destination
    );

    // ACTIVAR AUDIO AL REPRODUCIR

    reproductor.addEventListener(
      "play",
      async () => {
        if (contexto.state === "suspended") {
          try {
            await contexto.resume();
          } catch (error) {
            console.error(error);
          }
        }
      }
    );

    // PANEL DE FADERS

    const panel =
      document.createElement("div");

    panel.className = "mezclador";

    function crearFader(
      titulo,
      etiqueta,
      ganancia
    ) {

      const canal =
        document.createElement("div");

      canal.className = "canal";

      const encabezado =
        document.createElement("h3");

      encabezado.textContent = titulo;

      const deslizador =
        document.createElement("input");

      deslizador.type = "range";
      deslizador.className = "fader";
      deslizador.min = "0";
      deslizador.max = "100";
      deslizador.value = "100";

      deslizador.setAttribute(
        "aria-label",
        "Volumen canal " + etiqueta
      );

      const valor =
        document.createElement("div");

      valor.className = "valor";
      valor.textContent = "100%";

      const texto =
        document.createElement("div");

      texto.className = "etiqueta";
      texto.textContent = etiqueta;

      // 100% DEL FADER = GANANCIA 2

      deslizador.addEventListener(
        "input",
        () => {

          const volumen =
            Number(deslizador.value) / 100 * 2;

          ganancia.gain.value = volumen;

          valor.textContent =
            deslizador.value + "%";

        }
      );

      canal.append(
        encabezado,
        deslizador,
        valor,
        texto
      );

      return canal;
    }

    const faderL = crearFader(
      "CANAL L",
      "IZQUIERDO",
      gananciaL
    );

    const faderR = crearFader(
      "CANAL R",
      "DERECHO",
      gananciaR
    );

    panel.append(
      faderL,
      faderR
    );

    // ESTADO DEL AUDIO

    const aviso =
      document.createElement("p");

    aviso.className = "estado";
    aviso.textContent = "Pista de ensayo";

    reproductor.addEventListener(
      "canplay",
      () => {
        aviso.textContent =
          "Audio disponible para escuchar.";
      }
    );

    reproductor.addEventListener(
      "error",
      () => {
        aviso.textContent =
          "Audio no disponible. Verificá el archivo.";
      }
    );

    seccion.append(
      reproductor,
      panel,
      aviso
    );

  } else {

    const aviso =
      document.createElement("p");

    aviso.className = "estado";
    aviso.textContent =
      "Audio pendiente de cargar.";

    seccion.appendChild(aviso);

  }

  contenedor.appendChild(seccion);

});

</script>

</body>
</html>
