body {

  color: #111827;
  border: 3px solid white;
  border-radius: 14px;
  font-size: clamp(20px,5vw,34px);

  letter-spacing: 1px;

}

header p.aliento {
  color: #111827;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

.oculto {
  display: none !important;
}

/* INGRESO */

.ingreso {
  max-width: 440px;
  margin: 35px auto;
  padding: 30px 22px;
  text-align: center;
  background: rgba(31,41,55,.95);
  border: 1px solid #4b5563;
  border-radius: 16px;
}

.ingreso h2 {
  color: #facc15;
}

  width: 100%;

  margin: 15px 0;
  border: 2px solid #6b7280;
  border-radius: 9px;
  font-size: 18px;
  text-align: center;
}

button {
  padding: 12px 22px;
  background: #facc15;
  color: #111827;
  border: none;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #fde047;
}

.error {
  color: #fca5a5;
  font-weight: bold;
}

/* PANEL */

.panel-encabezado {
  text-align: center;
  padding: 22px;
  margin-bottom: 20px;
  background: rgba(31,41,55,.92);
  border-radius: 14px;
}

.instrumento {
  font-size: 54px;
  margin: 8px 0;
}

.panel-encabezado h2 {
  color: #facc15;
  margin: 8px 0;
}

.salir {
  margin-top: 12px;
  background: #374151;
  color: white;
  border: 1px solid #6b7280;
}

/* CANCIONES */

.cancion {
  background: rgba(31,41,55,.88);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 15px;
}

.cancion h2 {
  color: #facc15;
  font-size: 20px;
}

audio {
  width: 100%;
  margin-top: 10px;
}

.estado {
  color: #d1d5db;
  font-size: 14px;
}

.sin-metronomo {
  display: inline-block;
  margin: 15px 0 5px;
  padding: 9px 15px;
  background: #facc15;
  color: #111827;
  border-radius: 8px;
  font-weight: bold;
  font-size: 15px;
}

/* YOUTUBE HERNÁN */

.video-ensayo {
  margin-top: 22px;
  padding-top: 15px;
  border-top: 1px solid #4b5563;
}

.video-ensayo h3 {
  color: #facc15;
  font-size: 17px;
  margin: 0 0 12px;
}

.video-contenedor {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 10px;
  background: #000;
}

.video-contenedor iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

/* FADERS */

.mezclador {
  display: flex;
  justify-content: space-around;
  gap: 15px;
  margin-top: 20px;
}

.canal {
  flex: 1;
  max-width: 180px;
  background: rgba(17,24,39,.9);
  border: 1px solid #374151;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
}

.canal h3 {
  color: #facc15;
  margin: 0 0 15px;
  font-size: 16px;
}

.fader {
  writing-mode: vertical-lr;
  direction: rtl;
  width: 35px;
  height: 140px;
  cursor: pointer;
  accent-color: #facc15;
}

.valor {
  color: white;
  margin-top: 12px;
  font-size: 18px;
  font-weight: bold;
}

.etiqueta {
  color: #9ca3af;
  font-size: 12px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #d1d5db;
  background: rgba(17,24,39,.7);
}
</style>

/* =====================================================
   MOTOR DE AUDIO
===================================================== */

const AudioContextClass =
  window.AudioContext ||
  window.webkitAudioContext;

let contextoAudio = null;

function obtenerContexto() {

  if (!contextoAudio) {
    contextoAudio = new AudioContextClass();
  }

  return contextoAudio;
}

/* =====================================================
   ELEMENTOS
===================================================== */

const pantallaIngreso =
  document.getElementById("pantallaIngreso");

const formularioIngreso =
  document.getElementById("formularioIngreso");

const campoClave =
  document.getElementById("campoClave");

const mensajeError =
  document.getElementById("mensajeError");

const panelMusico =
  document.getElementById("panelMusico");

const contenedor =
  document.getElementById("canciones");

const nombreMusico =
  document.getElementById("nombreMusico");

const nombreInstrumento =
  document.getElementById("nombreInstrumento");

const iconoInstrumento =
  document.getElementById("iconoInstrumento");

const botonSalir =
  document.getElementById("botonSalir");

const mensajeAliento =
  document.getElementById("mensajeAliento");

/* =====================================================
   LOGIN
===================================================== */

formularioIngreso.addEventListener(
  "submit",
  evento => {

    evento.preventDefault();

    const claveIngresada =
      campoClave.value.trim();

    const idMusico =
      Object.keys(musicos).find(
        id =>
          musicos[id].clave ===
          claveIngresada
      );

    if (!idMusico) {

      mensajeError.textContent =
        "Clave incorrecta. Intentá nuevamente.";

      campoClave.value = "";
      campoClave.focus();

      return;
    }

    mensajeError.textContent = "";
    campoClave.value = "";

    abrirPanel(idMusico);
  }
);

/* =====================================================
   ABRIR PANEL
===================================================== */

function abrirPanel(idMusico) {

  const musico =
    musicos[idMusico];

  cambiarFondo(
    musico.fondo
  );

  /* MENSAJE ESPECIAL PARA FLOR */

  if (idMusico === "flor") {

    mensajeAliento.textContent =
      "¡ES MÁGICOOOO! ✨🎹";

  } else {

    mensajeAliento.textContent =
      "¡VAMOOOO PAPIRRIIII! 🎸🔥";
  }

  detenerAudios();

  contenedor.replaceChildren();

  nombreMusico.textContent =
    "PISTAS PARA " +
    musico.nombre.toUpperCase();

  nombreInstrumento.textContent =
    musico.instrumento;

  iconoInstrumento.textContent =
    musico.icono;

  pantallaIngreso
    .classList
    .add("oculto");

  panelMusico
    .classList
    .remove("oculto");

  canciones.forEach(
    (cancion, indice) => {

      crearCancion(
        cancion,
        indice,
        idMusico,
        musico
      );

    }
  );

  window.scrollTo(0, 0);
}

/* =====================================================
   DETENER AUDIOS Y VIDEOS
===================================================== */

function detenerAudios() {

  const reproductores =
    contenedor.querySelectorAll("audio");

  reproductores.forEach(
    reproductor => {

      reproductor.pause();
      reproductor.removeAttribute("src");
      reproductor.load();

    }
  );

  contenedor
    .querySelectorAll("iframe")
    .forEach(video => {

      video.removeAttribute("src");

    });
}

/* =====================================================
   SALIR
===================================================== */

botonSalir.addEventListener(
  "click",
  () => {

    detenerAudios();

    contenedor.replaceChildren();

    panelMusico

    pantallaIngreso
      .classList

    cambiarFondo(

    campoClave.focus();

    window.scrollTo(0, 0);

);

/* =====================================================
   CREAR CANCIÓN
===================================================== */

function crearCancion(
  cancion,
  indice,
  idMusico,
  musico
) {

  const numero =
    String(indice + 1)
      .padStart(2, "0");

  const seccion =
    document.createElement("section");

  seccion.className =
    "cancion";

  const nombre =
    document.createElement("h2");

  nombre.textContent =
    numero +
    " - " +
    cancion.titulo;

  seccion.appendChild(nombre);

  let participa = false;

  if (idMusico === "german") {

    participa =
      cancion.participaGerman;

  } else {

    participa =
      participacionPorMusico[
        idMusico
      ].includes(
        cancion.titulo
      );
  }

  if (!participa) {

    const aviso =
      document.createElement("p");

    aviso.className =
      "estado";

    aviso.textContent =
      musico.nombre +
      " no participa en este tema.";

    seccion.appendChild(aviso);

    contenedor.appendChild(seccion);

    return;
  }

  let archivo = "";

  if (idMusico === "german") {

    archivo =
      cancion.archivoGerman;

  } else {

    archivo =
      archivosPorMusico[
        idMusico
      ][cancion.titulo] || "";
  }

  if (!archivo) {

    const aviso =
      document.createElement("p");

    aviso.className =
      "estado";

    aviso.textContent =
      "Audio pendiente de cargar.";

    seccion.appendChild(aviso);

    contenedor.appendChild(seccion);

    return;
  }

  const descripcion =
    document.createElement("p");

  descripcion.textContent =
    "Pista completa de ensayo";

  const reproductor =
    document.createElement("audio");

  reproductor.controls = true;
  reproductor.preload = "metadata";

  if (
    archivo.startsWith("audios/")
  ) {

    reproductor.src =
      archivo
        .split("/")
        .map(
          parte =>
            encodeURIComponent(parte)
        )
        .join("/");

  } else {

    reproductor.src =
      musico.carpeta +
      "/" +
      encodeURIComponent(
        archivo
      );
  }

  const aviso =
    document.createElement("p");

  aviso.className =
    "estado";

  aviso.textContent =
    "Pista de ensayo";

  reproductor.addEventListener(
    "canplay",
    () => {

      aviso.textContent =
        "Audio disponible para escuchar.";

    }
  );

  reproductor.addEventListener(
    "error",
    () => {

      aviso.textContent =
        "Audio no disponible. Verificá el archivo.";

    }
  );

  seccion.append(
    descripcion,
    reproductor
  );

  if (
    cancion.sinMetronomo
  ) {

    const cartel =
      document.createElement("p");

    cartel.className =
      "sin-metronomo";

    cartel.textContent =
      "Estas van sin metrónomo";

    seccion.appendChild(cartel);

  } else {

    crearMezclador(
      reproductor,
      seccion
    );
  }

  seccion.appendChild(aviso);

  /* YOUTUBE SOLO HERNÁN */

  if (
    idMusico === "hernan" &&
    videosHernan[
      cancion.titulo
    ]
  ) {

    const bloqueVideo =
      document.createElement("div");

    bloqueVideo.className =
      "video-ensayo";

    const tituloVideo =
      document.createElement("h3");

    tituloVideo.textContent =
      "▶ Video de YouTube para ensayar";

    const contenedorVideo =
      document.createElement("div");

    contenedorVideo.className =
      "video-contenedor";

    const video =
      document.createElement("iframe");

    video.src =
      "https://www.youtube.com/embed/" +
      videosHernan[
        cancion.titulo
      ];

    video.title =
      "Video de ensayo: " +
      cancion.titulo;

    video.loading = "lazy";

    video.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

    video.allowFullscreen = true;

    contenedorVideo.appendChild(
      video
    );

    bloqueVideo.append(
      tituloVideo,
      contenedorVideo
    );

    seccion.appendChild(
      bloqueVideo
    );
  }

  contenedor.appendChild(
    seccion
  );
}

/* =====================================================
   MEZCLADOR ESTÉREO
===================================================== */

function crearMezclador(
  reproductor,
  seccion
) {

  const contexto =
    obtenerContexto();

  const fuente =
    contexto.createMediaElementSource(
      reproductor
    );

  const divisor =
    contexto.createChannelSplitter(2);

  const gananciaL =
    contexto.createGain();

  const gananciaR =
    contexto.createGain();

  const mezclador =
    contexto.createChannelMerger(2);

  gananciaL.gain.value = 2;
  gananciaR.gain.value = 2;

  fuente.connect(divisor);

  divisor.connect(
    gananciaL,
    0
  );

  divisor.connect(
    gananciaR,
    1
  );

  gananciaL.connect(
    mezclador,
    0,
    0
  );

  gananciaR.connect(
    mezclador,
    0,
    1
  );

  mezclador.connect(
    contexto.destination
  );

  reproductor.addEventListener(
    "play",
    async () => {

      if (
        contexto.state ===
        "suspended"
      ) {

        try {

          await contexto.resume();

        } catch (error) {

          console.error(error);

        }
      }
    }
  );

  const panel =
    document.createElement("div");

  panel.className =
    "mezclador";

  function crearFader(
    titulo,
    etiqueta,
    ganancia
  ) {

    const canal =
      document.createElement("div");

    canal.className =
      "canal";

    const encabezado =
      document.createElement("h3");

    encabezado.textContent =
      titulo;

    const deslizador =
      document.createElement("input");

    deslizador.type =
      "range";

    deslizador.className =
      "fader";

    deslizador.min =
      "0";

    deslizador.max =
      "100";

    deslizador.value =
      "100";

    deslizador.setAttribute(
      "aria-label",
      "Volumen canal " +
      etiqueta
    );

    const valor =
      document.createElement("div");

    valor.className =
      "valor";

    valor.textContent =
      "100%";

    const texto =
      document.createElement("div");

    texto.className =
      "etiqueta";

    texto.textContent =
      etiqueta;

    deslizador.addEventListener(
      "input",
      () => {

        const volumen =
          Number(
            deslizador.value
          ) / 100 * 2;

        ganancia.gain.value =
          volumen;

        valor.textContent =
          deslizador.value +
          "%";

      }
    );

    canal.append(
      encabezado,
      deslizador,
      valor,
      texto
    );

    return canal;
  }

  const faderL =
    crearFader(
      "CANAL L",
      "IZQUIERDO",
      gananciaL
    );

  const faderR =
    crearFader(
      "CANAL R",
      "DERECHO",
      gananciaR
    );

  panel.append(
    faderL,
    faderR
  );

  seccion.appendChild(
    panel
  );
}

</script>
